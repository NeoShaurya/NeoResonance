[package]
name = "neo-resonance"
version = "0.1.6"
description = "NeoResonance — Windows 11 Desktop Overlay Music Widget"
authors = ["Shaurya Chandra <me@neoshaurya.com>"]
edition = "2021"

[lib]
name = "neo_resonance_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustfft = "6.4"
base64 = "0.22"
windows = { version = "0.58", features = [
  "Media_Control",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
